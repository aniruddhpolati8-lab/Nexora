name: Nexora Training Test
on: workflow_dispatch: jobs: test: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - uses: actions/setup-python@v5 with: python-version: "3.11" - name: Install dependencies run: pip install torch sentencepiece - name: Check Python files run: | python -m py_compile nexora_model.py python -m py_compile tokenizer.py python -m py_compile train.py - name: Test Nexora run: python nexora_model.py
