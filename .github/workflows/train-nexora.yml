
from __future__ import annotations import os from pathlib import Path import torch from torch.utils.data import Dataset, DataLoader from nexora_model import ( NexoraModel, NexoraConfig ) from tokenizer import ( NexoraTokenizer ) # ============================================================ # CONFIGURATION # ============================================================ DATA_FILE = ( "training_data.txt" ) TOKENIZER_FILE = ( "nexora_tokenizer.model" ) CHECKPOINT_DIR = ( "checkpoints" ) # Chromebook-friendly defaults. BLOCK_SIZE = 256 BATCH_SIZE = 1 GRADIENT_ACCUMULATION = 8 EPOCHS = 1 LEARNING_RATE = 3e-4 WEIGHT_DECAY = 0.1 MAX_GRAD_NORM = 1.0 SAVE_EVERY = 500 # ============================================================ # DEVICE # ============================================================ def get_device(): if torch.cuda.is_available(): return torch.device( "cuda" ) if hasattr( torch.backends, "mps" ) and torch.backends.mps.is_available(): return torch.device( "mps" ) return torch.device( "cpu" ) # ============================================================ # DATASET # ============================================================ class LanguageDataset(Dataset): def __init__( self, tokens: list[int], block_size: int ): self.tokens = tokens self.block_size = block_size def __len__(self): return max( 0, len(self.tokens) - self.block_size ) def __getitem__( self, index: int ): start = index end = ( start + self.block_size + 1 ) sequence = self.tokens[ start:end ] input_ids = torch.tensor( sequence[:-1], dtype=torch.long ) labels = torch.tensor( sequence[1:], dtype=torch.long ) return ( input_ids, labels ) # ============================================================ # LOAD DATA # ============================================================ def load_training_text(): path = Path( DATA_FILE ) if not path.exists(): raise FileNotFoundError( f"{DATA_FILE} does not exist.\n" "Create a training_data.txt file " "first." ) text = path.read_text( encoding="utf-8" ) if not text.strip(): raise ValueError( "training_data.txt is empty." ) return text # ============================================================ # PREPARE DATA # ============================================================ def prepare_dataset( tokenizer: NexoraTokenizer ): print( "Loading training text..." ) text = load_training_text() print( "Tokenising..." ) tokens = tokenizer.encode( text ) print( f"Tokens: {len(tokens):,}" ) dataset = LanguageDataset( tokens, BLOCK_SIZE ) if len(dataset) == 0: raise ValueError( "Not enough tokens for the " "selected BLOCK_SIZE." ) return dataset # ============================================================ # CHECKPOINT # ============================================================ def save_checkpoint( model, optimizer, step, epoch ): os.makedirs( CHECKPOINT_DIR, exist_ok=True ) path = Path( CHECKPOINT_DIR ) / f"checkpoint_{step}.pt" torch.save( { "model": model.state_dict(), "optimizer": optimizer.state_dict(), "step": step, "epoch": epoch, }, path ) print( f"Saved checkpoint: {path}" ) # ============================================================ # TRAIN # ============================================================ def train(): device = get_device() print( "=" * 60 ) print( "NEXORA TRAINING" ) print( "=" * 60 ) print( "Device:", device ) tokenizer = NexoraTokenizer( TOKENIZER_FILE ) dataset = prepare_dataset( tokenizer ) loader = DataLoader( dataset, batch_size=BATCH_SIZE, shuffle=True ) config = NexoraConfig( vocab_size=tokenizer.vocab_size, context_length=BLOCK_SIZE ) model = NexoraModel( config ).to( device ) parameter_count = sum( parameter.numel() for parameter in model.parameters() ) print( f"Parameters: " f"{parameter_count:,}" ) optimizer = torch.optim.AdamW( model.parameters(), lr=LEARNING_RATE, weight_decay=WEIGHT_DECAY ) model.train() step = 0 optimizer.zero_grad( set_to_none=True ) for epoch in range( EPOCHS ): print( f"\nEpoch {epoch + 1}" ) for batch_index, batch in enumerate( loader ): input_ids, labels = batch input_ids = input_ids.to( device ) labels = labels.to( device ) output = model( input_ids, labels ) loss = output["loss"] loss = ( loss / GRADIENT_ACCUMULATION ) loss.backward() if ( (batch_index + 1) % GRADIENT_ACCUMULATION == 0 ): torch.nn.utils.clip_grad_norm_( model.parameters(), MAX_GRAD_NORM ) optimizer.step() optimizer.zero_grad( set_to_none=True ) step += 1 if step % 10 == 0: print( f"step={step} " f"loss={loss.item():.4f}" ) if ( step % SAVE_EVERY == 0 ): save_checkpoint( model, optimizer, step, epoch ) save_checkpoint( model, optimizer, step, EPOCHS ) print( "\nTraining complete." ) # ============================================================ # ENTRY POINT # ============================================================ if __name__ == "__main__": try: train() except KeyboardInterrupt: print( "\nTraining stopped." ) except Exception as error: print( "\nTraining error:" ) print( error )
